name: Release

# Compiling happens here and only here. The development machine is a Windows
# ARM64 laptop with an x64-only MSVC toolchain, so building locally meant
# emulating x64, burning SSD writes, and maintaining wrapper scripts. A public
# repository gets the native `windows-11-arm` runner for free, which makes all
# of that unnecessary.
#
# NOTE: `windows-11-arm` only exists for PUBLIC repositories. Making this repo
# private will break this workflow.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag name to publish (e.g. v0.1.0)
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-arm64:
    name: Build Windows ARM64
    runs-on: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # On an ARM64 runner the host toolchain already targets
      # aarch64-pc-windows-msvc, so this needs no cross-compilation setup.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: arm64-windows

      - name: Install dependencies
        run: npm ci

      - name: Verify frontend
        run: |
          npm run check:integrity
          npm run typecheck
          npm run test

      - name: Build application
        run: npm run tauri build -- --target aarch64-pc-windows-msvc --bundles nsis

      - name: Collect artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ github.event.inputs.tag || github.ref_name }}"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $exe = Get-ChildItem -Path src-tauri/target -Recurse -File -Filter flight-focus.exe |
            Where-Object { $_.FullName -match 'release' } |
            Select-Object -First 1
          if (-not $exe) { throw 'flight-focus.exe was not produced by the build.' }
          Write-Host "Found application binary: $($exe.FullName)"

          # Portable build: the bare executable, no installer, no signing.
          Copy-Item $exe.FullName artifacts/ -Force
          Compress-Archive -Path $exe.FullName `
            -DestinationPath "artifacts/flight-focus-$version-arm64-portable.zip" -Force

          # Installer produced by the NSIS bundler.
          $installer = Get-ChildItem -Path src-tauri/target -Recurse -File |
            Where-Object { $_.FullName -match 'bundle' -and $_.Extension -eq '.exe' } |
            Select-Object -First 1
          if ($installer) {
            Write-Host "Found installer: $($installer.FullName)"
            Copy-Item $installer.FullName artifacts/ -Force
          } else {
            Write-Warning 'No installer was produced; the portable build is still available.'
          }

          Get-ChildItem artifacts | Format-Table Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flight-focus-windows-arm64
          path: artifacts/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          # Semver prerelease suffixes (v0.1.0-alpha) publish as prereleases;
          # plain tags (v0.2.0) publish as stable releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
